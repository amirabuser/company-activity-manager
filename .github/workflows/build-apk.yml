name: Build Personal Agent APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reuse debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: personal-agent-debug-signing-v2
      - name: Compile and check Android app
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Name installable APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Personal-Agent-2.0.apk
      - name: Upload Personal Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Agent-2.0-APK
          path: output/Personal-Agent-2.0.apk
          if-no-files-found: error
