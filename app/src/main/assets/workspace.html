<script>

let db={records:[],events:[]},page='home',current=0,filter='all',query='',toastTimer,navBefore='home';
const $=id=>document.getElementById(id);
const bridge=()=>window.Workspace;
function load(){try{if(!bridge())throw Error('اتصال برنامه در دسترس نیست');db=JSON.parse(Workspace.data());render()}catch(e){$('app').innerHTML='<div class="empty"><h3>دریافت اطلاعات انجام نشد</h3><p>'+esc(e.message)+'</p><button class="primary" data-act="retry">تلاش دوباره</button></div>'}}
function status(r){if(r.status==='پرداخت شد')return'paid';if(r.status==='نیازمند اصلاح')return'defect';if(r.status==='تحویل به مالی')return'finance';if(r.status==='رفع نقص شد')return'fixed';return'received'}

function header(){return'<header class="topbar"><div class="brand"><div class="logo">'+I('spark')+'</div><div><strong dir="ltr" style="font-size:16px;letter-spacing:-.5px">Personal Agent</strong><small>YOUR WORKSPACE</small></div></div><button class="round" aria-label="پشتیبان و تنظیمات" data-page="tools">'+I('shield')+'</button></header>'}

function stat(count,label,icon,bg,color,kind){return'<button class="stat" data-filter="'+kind+'"><span class="symbol" style="background:'+bg+';color:'+color+'">'+I(icon)+'</span><b>'+fa(count)+'</b><small>'+label+'</small></button>'}
function home(){const all=db.records.length,paid=db.records.filter(r=>status(r)==='paid').length,defect=db.records.filter(r=>status(r)==='defect').length,finance=db.records.filter(r=>status(r)==='finance').length,pending=all-paid;let greeting='سلام، وقتت بخیر';const hour=new Date().getHours();if(hour<12)greeting='سلام، صبح بخیر';else if(hour<18)greeting='سلام، خسته نباشی';else greeting='سلام، شبت بخیر';
return header()+'<div class="intro"><div><small>'+greeting+'</small><h1>امروز، همه‌چیز<br>روی مسیر.</h1></div><span class="date">'+date(Date.now())+'</span></div><section class="hero"><div class="hero-head"><span class="dot"></span> نمای کلی فضای کار</div><div class="hero-number">'+fa(pending)+'<span>پرونده در جریان</span></div><div class="hero-foot"><p>'+(all?fa(paid)+' از '+fa(all)+' پرونده پرداخت شده':'با اولین پرونده، مسیرت را شروع کن')+'</p><button class="hero-action" data-page="records">دیدن پرونده‌ها '+I('arrow')+'</button></div><div class="progress"><i style="width:'+(all?paid/all*100:0)+'%"></i></div></section><div class="stats">'+stat(finance,'در واحد مالی','wallet','#edf2f9','#6e85ac','finance')+stat(defect,'نیازمند اصلاح','alert','#fff0e7','#d58a63','defect')+stat(paid,'پرداخت‌شده','check','#edf6f0','#4a9681','paid')+'</div><div class="section-head"><h2>آخرین پرونده‌ها</h2><button data-page="records">همه پرونده‌ها '+I('arrow')+'</button></div>'+(all?db.records.slice(0,4).map(card).join(''):empty())+(db.events.length?'<div class="section-head"><h2>تازه‌ترین فعالیت‌ها</h2><span class="muted">'+I('history')+'</span></div>'+db.events.slice(0,4).map(activity).join(''):'')}
function activity(e){const r=db.records.find(r=>r.id===e.record_id);return'<button class="activity block" style="text-align:right" data-record="'+e.record_id+'"><span class="activity-icon">'+I(eventIcon(e.title))+'</span><div><h3>'+esc(e.title)+'</h3><p>'+esc(r?.printer||'پرونده')+'</p></div><time>'+date(e.at,true)+'</time></button>'}
function searchBar(){return'<div class="search">'+I('search')+'<input id="search" aria-label="جست‌وجوی پرونده" placeholder="نام چاپخانه، استان یا شمارهٔ پرونده…" value="'+esc(query)+'" autocomplete="off"><button data-act="clear" aria-label="پاک کردن جست‌وجو" style="display:'+(query?'block':'none')+'">'+I('close')+'</button></div>'}
function filtered(){const q=normalize(query);return db.records.filter(r=>(filter==='all'||status(r)===filter)&&(!q||normalize(r.printer+' '+r.province+' '+r.id).includes(q)))}
function records(){return header()+'<div class="intro"><div><div class="page-label">YOUR WORK, ORGANIZED</div><h1>پرونده‌ها</h1></div><small>'+fa(db.records.length)+' پرونده</small></div>'+searchBar()+'<div class="filters">'+[['all','همه'],['received','دریافت‌شده'],['finance','در واحد مالی'],['defect','نیازمند اصلاح'],['fixed','رفع نقص شده'],['paid','پرداخت‌شده']].map(([k,t])=>'<button class="chip '+(filter===k?'active':'')+'" data-kind="'+k+'">'+t+'</button>').join('')+'</div><div id="record-list">'+recordList()+'</div>'}
function recordList(){const rs=filtered();return rs.length?rs.map(card).join(''):db.records.length?empty('چیزی با این مشخصات پیدا نشد','عبارت جست‌وجو یا فیلتر وضعیت را تغییر بده.',false):empty()}
function eventIcon(t){if(t==='پرداخت شد')return'wallet';if(t==='نیازمند اصلاح')return'alert';if(t==='رفع نقص شد')return'check';if(t==='عکس هنگام دریافت')return'photo';if(t==='تصمیم مدیر فروش'||t==='یادداشت')return'note';return'file'}
function detail(){const r=db.records.find(x=>x.id===current);if(!r){page='records';return records()}const es=db.events.filter(e=>e.record_id===r.id);const ordered=es.slice().reverse();const level=status(r)==='paid'?2:es.some(e=>e.title==='تحویل به مالی')?1:0;
return '<header class="back-header"><button class="round" data-act="back" aria-label="بازگشت">'+I('back')+'</button><div><h2>جزئیات پرونده</h2><small>هر اتفاق، در زمان خودش</small></div><button class="round" style="margin-right:auto" data-action="یادداشت" aria-label="افزودن یادداشت">'+I('note')+'</button></header><section class="detail-hero"><div style="display:flex;justify-content:space-between;align-items:center"><small style="color:#aab3c2">پروندهٔ '+fa(r.id)+'</small>'+badge(r)+'</div><h1>'+esc(r.printer)+'</h1><div class="detail-meta"><span>'+I('pin')+esc(r.province)+'</span><span>'+I('file')+fa(r.qty)+' فاکتور</span><span>'+I('clock')+date(r.created,true)+'</span></div></section><div class="steps">'+[['file','دریافت'],['wallet','واحد مالی'],['check','پرداخت']].map(([i,t],n)=>'<div class="step '+(n<level?'done':n===level?'current':'')+'"><span>'+I(n<level?'check':i)+'</span>'+t+'</div>').join('')+'</div><div class="section-head"><h2>قدم بعدی</h2><small>ثبت سریع رویداد</small></div><div class="actions">'+[['wallet','تحویل به مالی','تحویل به مالی'],['alert','ثبت نقص','نیازمند اصلاح'],['check','رفع نقص','رفع نقص شد'],['photo','عکس فاکتور','photo'],['wallet','ثبت پرداخت','payment'],['note','تصمیم مدیر','تصمیم مدیر فروش']].map(([i,t,a])=>'<button class="action '+(a==='payment'?'accent':'')+'" data-action="'+a+'">'+I(i)+t+'</button>').join('')+'</div><div class="section-head"><h2>داستان این پرونده</h2><small>'+fa(es.length)+' رویداد</small></div><section class="timeline">'+ordered.map(e=>'<article class="event"><span class="event-dot">'+I(eventIcon(e.title))+'</span><h3>'+esc(e.title)+'</h3><time>'+date(e.at)+' • '+time(e.at)+'</time>'+(e.detail?'<p>'+esc(e.detail)+'</p>':'')+(e.photo?'<button class="attachment" data-photo="'+e.id+'"><img data-thumb="'+e.id+'" alt="پیش‌نمایش پیوست"><span>مشاهدهٔ '+(e.title==='پرداخت شد'?'فیش پرداخت':'پیوست')+'</span>'+I('arrow')+'</button>':'')+'</article>').join('')+'</section>'}
function reports(){const all=db.records.length,qty=db.records.reduce((s,r)=>s+r.qty,0),paid=db.records.filter(r=>status(r)==='paid').length;return header()+'<div class="intro"><div><div class="page-label">A CLEARER PICTURE</div><h1>نگاه کلی</h1></div><span class="round">'+I('chart')+'</span></div><div class="report-grid"><div class="report-box"><small>تعداد پرونده‌ها</small><b>'+fa(all)+'</b><p>از شروع تا امروز</p></div><div class="report-box"><small>تعداد فاکتورها</small><b>'+fa(qty)+'</b><p>مجموع تحویل‌های ثبت‌شده</p></div></div><section class="panel"><h3>'+I('chart')+'وضعیت رسیدگی</h3>'+[['received','#929cab'],['finance','#7995bf'],['defect','#e4a07e'],['fixed','#c5b476'],['paid','#65a88c']].map(([k,c])=>{const n=db.records.filter(r=>status(r)===k).length;return'<div class="bar-row"><div class="bar-label"><span>'+names[k]+'</span><span>'+fa(n)+' پرونده</span></div><div class="bar-track"><span style="width:'+(all?n/all*100:0)+'%;background:'+c+'"></span></div></div>'}).join('')+'</section><section class="panel"><h3>'+I('download')+'گزارش برای اکسل</h3><p>جزئیات پرونده‌ها و تمام رویدادها، با تاریخ شمسی. تصاویر در گزارش CSV قرار نمی‌گیرند.</p><button class="primary block" data-export="csv">'+I('download')+'ذخیرهٔ گزارش CSV</button></section><p class="muted" style="text-align:center">'+(all?fa(Math.round(paid/all*100))+'٪ از پرونده‌ها به مرحلهٔ پرداخت رسیده‌اند':'آمار واقعی با اولین پرونده نمایش داده می‌شود')+'</p>'}
function tools(){return header()+'<div class="intro"><div><div class="page-label">KEEP YOUR WORK SAFE</div><h1>خیالت از کار راحت.</h1></div></div><section class="panel"><h3>'+I('shield')+'پشتیبان کامل</h3><p>یک نسخه از تمام پرونده‌ها، سوابق و عکس‌ها ذخیره کن. فایل بکاپ را در جای مطمئن نگه دار.</p><button class="primary block" data-export="backup">'+I('download')+'ذخیرهٔ بکاپ کامل</button><button class="outline block" style="margin-top:10px" data-import="backup">'+I('upload')+'وارد کردن بکاپ</button></section><section class="panel"><h3>'+I('history')+'گزارش‌های قبلی</h3><p>اگر از نسخهٔ قبلی خروجی CSV داری، اطلاعات متنی و سوابقش را اینجا وارد کن. تصاویر را باید دوباره پیوست کنی.</p><button class="outline block" data-import="csv">'+I('upload')+'ورود CSV نسخهٔ قبلی</button></section><section class="panel"><h3>'+I('box')+'فضای شخصی و آفلاین</h3><p style="margin-bottom:0">اطلاعات روی همین دستگاه ذخیره می‌شود. برای ثبت و پیگیری اینترنت لازم نیست. حذف برنامه بدون بکاپ، اطلاعات آن را پاک می‌کند.</p></section><div style="text-align:center;padding:15px"><div class="logo" style="margin:0 auto 10px;width:35px;height:35px;border-radius:12px">'+I('spark')+'</div><strong dir="ltr" style="font-size:13px">Personal Agent</strong><p class="muted" style="font-size:9px">فضای مرتب کارهای تو • نسخهٔ ۲.۰</p></div>'}
function render(scroll=true){$('app').innerHTML=page==='home'?home():page==='records'?records():page==='detail'?detail():page==='reports'?reports():tools();nav();if(scroll)window.scrollTo(0,0);if(page==='detail')setTimeout(loadThumbs,100)}
function loadThumbs(){document.querySelectorAll('[data-thumb]').forEach(img=>{try{const src=Workspace.thumb(Number(img.dataset.thumb));if(src)img.src=src}catch(e){}})}
function sheet(title,sub,body){$('modal').innerHTML='<div class="sheet-overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="handle"></div><header class="sheet-head"><h2>'+title+'</h2><button data-act="close" aria-label="بستن">'+I('close')+'</button></header><p class="sheet-sub">'+sub+'</p>'+body+'</section></div>';document.body.style.overflow='hidden'}
function closeSheet(){$('modal').innerHTML='';document.body.style.overflow=''}
function newRecord(){sheet('یک تحویل تازه','ثبت کن؛ زمان دریافت به‌صورت خودکار ذخیره می‌شود.','<form id="new-form"><div class="field"><label for="province">استان</label><input id="province" placeholder="مثلاً تهران" required maxlength="120"></div><div class="field"><label for="printer">نام چاپخانه</label><input id="printer" placeholder="نام چاپخانه را بنویس" required maxlength="180"></div><div class="field"><label for="qty">تعداد فاکتورها</label><input id="qty" inputmode="numeric" placeholder="مثلاً ۱۲" required maxlength="7"></div><div class="form-note">'+I('clock')+date(Date.now())+' • '+time(Date.now())+'</div><p class="error" id="form-error" role="alert"></p><button class="primary block" type="submit">'+I('plus')+'ثبت و شروع پیگیری</button></form>')}
function openAction(action){if(action==='photo'){Workspace.photo(current,false,'');return}if(action==='payment'){sheet('ثبت پرداخت','فیش را انتخاب کن تا پرداخت در سوابق ثبت شود.','<div class="field"><label for="event-detail">توضیح پرداخت (اختیاری)</label><textarea id="event-detail" placeholder="شماره پیگیری یا توضیح کوتاه…" maxlength="4000"></textarea></div><button class="primary block" data-act="pay-photo">'+I('photo')+'انتخاب فیش و ثبت پرداخت</button>');return}
if(action==='نیازمند اصلاح'){sheet('چه چیزی نیاز به اصلاح دارد؟','علت دقیق را انتخاب کن تا در تایم‌لاین بماند.',['نقص فرم سفارش چاپ و نصب','فقدان تأییدیه نصب','مغایرت اعداد فاکتور','سایر'].map(t=>'<button class="option" data-defect="'+t+'">'+I('alert')+t+'</button>').join(''));return}
if(action==='تصمیم مدیر فروش'){sheet('تصمیم مدیر فروش','نوع تصمیم را انتخاب و در سابقهٔ پرونده ثبت کن.',['عودت اصل فاکتور به استان','نگهداری اصل نزد واحد','کنارگذاری / ابطال با دستور مدیر فروش'].map(t=>'<button class="option" data-decision="'+t+'">'+I('note')+t+'</button>').join(''));return}
eventForm(action,action==='یادداشت'?'یادداشتت را برای این پرونده بنویس.':'این رویداد با زمان فعلی ثبت می‌شود.')}
function eventForm(title,sub,prefill=''){sheet(title,sub,'<form id="event-form" data-title="'+esc(title)+'"><div class="field"><label for="event-detail">توضیحات '+(title==='یادداشت'||title==='نیازمند اصلاح'?'':'(اختیاری)')+'</label><textarea id="event-detail" placeholder="توضیح کوتاه…" maxlength="4000" '+(title==='یادداشت'||title==='نیازمند اصلاح'?'required':'')+'>'+esc(prefill)+'</textarea></div><p class="error" id="form-error" role="alert"></p><button class="primary block" type="submit">'+I('check')+'ثبت در تایم‌لاین</button></form>')}
function saveEvent(title,detail){try{if(Workspace.event(current,title,detail)){closeSheet();load();nativeMessage('رویداد به پرونده اضافه شد')}}catch(e){nativeMessage('ثبت رویداد انجام نشد')}}
window.nativeRefresh=()=>load();window.nativeMessage=text=>{clearTimeout(toastTimer);$('toast').innerHTML='<div class="toast" role="status">'+esc(text)+'</div>';toastTimer=setTimeout(()=>$('toast').innerHTML='',5000)};
window.goBack=()=>{if($('modal').innerHTML){closeSheet();return}if(page==='detail'){page=navBefore;render();return}if(page!=='home'){page='home';render();return}sheet('از فضای کار خارج می‌شوی؟','اطلاعات ثبت‌شده روی دستگاه محفوظ می‌ماند.','<button class="primary block" data-act="close">ادامهٔ کار</button><button class="outline block" style="margin-top:10px" data-act="exit">خروج از برنامه</button>')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.classList.contains('sheet-overlay'))closeSheet();return}if(b.dataset.page){page=b.dataset.page;query='';filter='all';closeSheet();render()}else if(b.dataset.record){navBefore=page==='detail'?navBefore:page;current=Number(b.dataset.record);page='detail';render()}else if(b.dataset.kind){filter=b.dataset.kind;render(false)}else if(b.dataset.filter){filter=b.dataset.filter;query='';page='records';render()}else if(b.dataset.action)openAction(b.dataset.action);else if(b.dataset.photo)Workspace.viewPhoto(Number(b.dataset.photo));else if(b.dataset.export){Workspace.export(b.dataset.export)}else if(b.dataset.import){const kind=b.dataset.import;sheet(kind==='backup'?'ورود بکاپ':'ورود گزارش قبلی',kind==='backup'?'پرونده‌ها به اطلاعات موجود اضافه می‌شوند؛ موارد فعلی پاک نمی‌شوند.':'از نسخهٔ قبلی، گزارش CSV بگیر و همان فایل را انتخاب کن.','<div class="note-box">'+(kind==='backup'?'هر بار وارد کردن بکاپ، یک نسخهٔ تازه از پرونده‌ها اضافه می‌کند. از ورود تکراری یک بکاپ خودداری کن.':'فقط اطلاعات متنی منتقل می‌شوند. پیوست‌ها داخل CSV نیستند.')+'</div><button class="primary block" data-pick="'+kind+'">'+I('upload')+'انتخاب فایل</button>')}else if(b.dataset.pick){Workspace.importFile(b.dataset.pick);closeSheet()}else if(b.dataset.defect){eventForm('نیازمند اصلاح','علت توقف را بررسی و ثبت کن.',b.dataset.defect==='سایر'?'':b.dataset.defect)}else if(b.dataset.decision){eventForm('تصمیم مدیر فروش','تصمیم ثبت می‌شود؛ وضعیت پرداخت پرونده تغییر نمی‌کند.',b.dataset.decision)}else if(b.dataset.act==='exit'){Workspace.closeApp()}else if(b.dataset.act==='new')newRecord();else if(b.dataset.act==='close')closeSheet();else if(b.dataset.act==='back')goBack();else if(b.dataset.act==='retry')load();else if(b.dataset.act==='pay-photo'){const text=$('event-detail').value;closeSheet();Workspace.photo(current,true,text)}else if(b.dataset.act==='clear'){query='';render(false);$('search')?.focus()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('record-list').innerHTML=recordList();const b=document.querySelector('[data-act="clear"]');if(b)b.style.display=query?'block':'none'}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='new-form'){const b=f.querySelector('[type="submit"]');b.disabled=true;try{const result=JSON.parse(Workspace.create($('province').value,$('printer').value,$('qty').value));if(result.error){$('form-error').textContent=result.error;return}closeSheet();current=result.id;navBefore='home';page='detail';load();nativeMessage('پرونده ثبت شد؛ مسیرش از همین‌جا شروع می‌شود')}catch(err){if($('form-error'))$('form-error').textContent='ثبت انجام نشد؛ دوباره امتحان کن'}finally{b.disabled=false}}else if(f.id==='event-form'){const text=$('event-detail').value.trim();if(['یادداشت','نیازمند اصلاح'].includes(f.dataset.title)&&!text){$('form-error').textContent='توضیح این رویداد را وارد کن';return}saveEvent(f.dataset.title,text)}});
load();
</script></body></html>
